[package]
name = "pantodo"
version = "0.3.0"
description = "A little room for your Todos and your time"
authors = ["Kevin Huang"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "pantodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pantodo"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-power-monitor", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-power-monitor = { version = "=0.1.0", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
strip = true
opt-level = 2
incremental = true

[patch.crates-io]
tauri-plugin-power-monitor = { path = "vendor/tauri-plugin-power-monitor" }
